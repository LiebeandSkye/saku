<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#FAFBFC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15171C" media="(prefers-color-scheme: dark)" />
    <title>アンキ SAKU — Passive Japanese Flashcards for Android</title>
    <meta name="description" content="Passive Japanese immersion on your Lock Screen and Home Screen. 100% on-device AnkiDroid sync with zero account required." />
    
    <!-- Open Graph / Meta -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="アンキ SAKU — Passive Japanese Flashcards for Android" />
    <meta property="og:description" content="Passive Japanese immersion on your Lock Screen and Home Screen. 100% on-device AnkiDroid sync." />
    <meta property="og:image" content="/favicon.svg" />

    <!-- Preload hero poster for instant first paint -->
    <link rel="preload" as="image" href="/screenshots/demo-poster.webp" type="image/webp" />

    <!-- Google Fonts: Plus Jakarta Sans, Noto Sans JP, Noto Serif JP, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@300;400;500;600;700&family=Noto+Serif+JP:wght@400;600;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Theme detection before paint to prevent flash -->
    <script>
      (function() {
        var theme = localStorage.getItem('saku-theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-saku-matcha selection:text-[#091F11] min-h-screen overflow-x-hidden font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
